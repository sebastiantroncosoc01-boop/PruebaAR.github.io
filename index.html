<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2328">
  <title>Visor AR industrial</title>

  <!-- Una sola librería (~300 KB comprimida). iOS usa Quick Look; Android usa WebXR/Scene Viewer. -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    :root {
      --ink: #1f2328;
      --paper: #f1efe9;
      --line: #cfcbc0;
      --accent: #f2b705;
      --muted: #5f6368;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: var(--paper); color: var(--ink);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header { padding: 14px 16px 8px; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    #desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

    model-viewer {
      flex: 1; min-height: 0; width: 100%;
      background: #e4e1d8;
      --poster-color: transparent;
    }

    /* Barra de carga */
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: transparent; transition: opacity .3s; }
    .bar > span { display: block; height: 100%; width: 0; background: var(--accent); }
    .bar.done { opacity: 0; }

    /* Botón AR dentro del visor */
    #arBtn {
      position: absolute; right: 12px; bottom: 16px;
      min-height: 48px; padding: 0 20px; border: 0; border-radius: 10px;
      background: var(--accent); color: var(--ink);
      font: inherit; font-weight: 700; cursor: pointer;
    }

    #msg {
      position: absolute; left: 12px; right: 12px; top: 12px;
      background: var(--ink); color: #fff; border-radius: 8px;
      padding: 10px 12px; font-size: 14px; display: none;
    }

    footer { padding: 10px 12px 14px; display: grid; gap: 10px; }
    .group { display: flex; gap: 8px; }
    .group.scroll { overflow-x: auto; scrollbar-width: none; }
    .group.scroll::-webkit-scrollbar { display: none; }
    .group button {
      flex: 1 0 auto; min-height: 44px; padding: 0 14px;
      border: 1.5px solid var(--ink); border-radius: 10px;
      background: transparent; color: var(--ink);
      font: inherit; cursor: pointer; white-space: nowrap;
    }
    .group button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #scaleNote { margin: 0; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Visor AR industrial</h1>
    <p id="desc">Máquina, fardo y apilamiento en conjunto.</p>
  </header>

  <model-viewer id="mv"
    alt="Modelo industrial en 3D"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="0.8"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    loading="eager"
    reveal="auto">
    <button id="arBtn" slot="ar-button" type="button">Ver en AR</button>
    <div class="bar" id="bar" slot="progress-bar"><span id="barFill"></span></div>
    <div id="msg" role="status"></div>
  </model-viewer>

  <footer>
    <div class="group scroll" id="objGroup" role="group" aria-label="Objeto">
      <button type="button" data-obj="conjunto" aria-pressed="true">Conjunto</button>
      <button type="button" data-obj="maquina" aria-pressed="false">Máquina</button>
      <button type="button" data-obj="fardo" aria-pressed="false">Fardo</button>
      <button type="button" data-obj="apilamiento" aria-pressed="false">Apilamiento</button>
    </div>
    <div class="group" id="scaleGroup" role="group" aria-label="Escala">
      <button type="button" data-scale="1a1" aria-pressed="true">Escala real 1:1</button>
      <button type="button" data-scale="1a60" aria-pressed="false">Maqueta 1:60</button>
    </div>
    <p id="scaleNote">En AR el tamaño queda fijo. Ponte de pie a 2 m del lugar y apunta al suelo.</p>
  </footer>

<script>
  /* ====== CONFIGURACIÓN ======
     Los archivos salen de preparar.mjs y deben estar en ./modelos/
       conjunto.glb, conjunto_1a60.glb, maquina.glb, maquina_1a60.glb, ...
     Si además tienes un .usdz con el mismo nombre (conjunto.usdz, conjunto_1a60.usdz...),
     pon USAR_USDZ = true: en iPhone abre al instante, sin generarlo al tocar "Ver en AR". */
  const CARPETA = './modelos/';
  const USAR_USDZ = false;

  const DESCRIPCIONES = {
    conjunto: 'Máquina, fardo y apilamiento en conjunto.',
    maquina: 'Máquina industrial principal.',
    fardo: 'Fardo individual de material compactado.',
    apilamiento: 'Fardos apilados.'
  };

  const mv = document.getElementById('mv');
  const msg = document.getElementById('msg');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('barFill');
  const estado = { obj: 'conjunto', escala: '1a1' };

  function mostrar(texto) {
    msg.textContent = texto;
    msg.style.display = texto ? 'block' : 'none';
  }

  function cargar() {
    const base = CARPETA + estado.obj + (estado.escala === '1a60' ? '_1a60' : '');
    bar.classList.remove('done');
    fill.style.width = '0';
    mostrar('');
    if (USAR_USDZ) mv.setAttribute('ios-src', base + '.usdz');
    else mv.removeAttribute('ios-src');
    mv.src = base + '.glb';
    document.getElementById('desc').textContent =
      DESCRIPCIONES[estado.obj] + (estado.escala === '1a60' ? ' Escala 1:60.' : ' Escala real.');
  }

  function activar(grupo, atributo, valor) {
    document.querySelectorAll(`#${grupo} button`).forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset[atributo] === valor)));
  }

  document.getElementById('objGroup').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    estado.obj = b.dataset.obj; activar('objGroup', 'obj', estado.obj); cargar();
  });
  document.getElementById('scaleGroup').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    estado.escala = b.dataset.scale; activar('scaleGroup', 'scale', estado.escala); cargar();
  });

  mv.addEventListener('progress', e => {
    fill.style.width = Math.round(e.detail.totalProgress * 100) + '%';
  });
  mv.addEventListener('load', () => {
    bar.classList.add('done');
    if (!mv.canActivateAR) {
      document.getElementById('scaleNote').textContent =
        'La vista AR solo está disponible en un móvil (Safari en iPhone o Chrome en Android).';
    }
  });
  mv.addEventListener('error', () => {
    mostrar('No se pudo cargar el modelo. Revisa que el archivo exista en la carpeta "modelos" y que el nombre coincida (mayúsculas incluidas).');
  });

  cargar();
</script>
</body>
</html>
