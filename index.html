<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Visor AR Híbrido - Industrial</title>

  <!-- Librería para iOS (Model-Viewer) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <!-- Librerías para Android (Three.js para WebXR) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    body { margin: 0; font-family: sans-serif; background: #f1efe9; overflow: hidden; }
    
    /* Contenedores de Interfaz */
    #ios-container, #android-container { display: none; width: 100vw; height: 100vh; }
    
    /* Estilos de iOS */
    model-viewer { width: 100%; height: 100%; }
    .ios-menu { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 10; }
    .btn { padding: 12px 20px; background: #1f2328; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    /* Estilos de Android */
    #android-menu { position: absolute; bottom: 80px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 10; }
    .btn-android { padding: 12px 20px; background: #f2b705; color: #1f2328; border: none; border-radius: 8px; font-weight: bold; }
    #android-status { position: absolute; top: 20px; left: 20px; right: 20px; text-align: center; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; z-index: 10; }
  </style>
</head>
<body>

  <!-- =============================== -->
  <!-- EXPERIENCIA iOS (MODEL VIEWER)  -->
  <!-- =============================== -->
  <div id="ios-container">
    <model-viewer id="mv-ios" src="conjunto.glb" ar ar-modes="quick-look" ar-scale="fixed" camera-controls shadow-intensity="1">
      <button slot="ar-button" class="btn" style="position:absolute; top:20px; right:20px;">Abrir en AR (iOS)</button>
    </model-viewer>
    <div class="ios-menu">
      <button class="btn" onclick="document.getElementById('mv-ios').src='conjunto.glb'">Escala 1:1</button>
      <button class="btn" onclick="document.getElementById('mv-ios').src='conjunto_1a60.glb'">Escala 1:60</button>
    </div>
  </div>

  <!-- =============================== -->
  <!-- EXPERIENCIA ANDROID (THREE.JS)  -->
  <!-- =============================== -->
  <div id="android-container">
    <div id="android-status">Iniciando motor AR para Android...</div>
    <div id="android-menu">
      <button class="btn-android" id="btn-maquina">Poner Máquina</button>
      <button class="btn-android" id="btn-fardo">Poner Fardo</button>
    </div>
    <!-- Aquí Three.js inyectará su botón de AR y su Canvas (Cámara) -->
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. DETECCIÓN DE SISTEMA OPERATIVO
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isIOS) {
      // Mostrar la interfaz de iOS y ocultar Android
      document.getElementById('ios-container').style.display = 'block';
    } else {
      // Mostrar la interfaz de Android y configurar WebXR
      document.getElementById('android-container').style.display = 'block';
      initAndroidAR();
    }

    // 2. LÓGICA DE ANDROID (WEBXR CON THREE.JS)
    function initAndroidAR() {
      let container, camera, scene, renderer, reticle;
      let hitTestSource = null;
      let hitTestSourceRequested = false;
      
      // Variables para los modelos separados
      let loader = new GLTFLoader();
      let maquinaModelo, fardoModelo;
      let modeloSeleccionado = null; // Qué objeto va a colocar el usuario

      const status = document.getElementById('android-status');

      init();
      animate();

      function init() {
        container = document.getElementById('android-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        // Iluminación
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        // Configuración del motor de render
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // Activar Realidad Aumentada
        container.appendChild(renderer.domElement);

        // Inyectar el botón nativo de WebXR
        const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
        arButton.style.bottom = '150px'; // Subir el botón para que no tape el menú
        document.body.appendChild(arButton);

        // Precargar modelos individuales (Asegúrate de que existan estos archivos)
        loader.load('Maquina A prueba.glb', function (gltf) {
          maquinaModelo = gltf.scene;
          status.innerText = "Máquina cargada. Selecciona un objeto.";
          modeloSeleccionado = maquinaModelo; // Por defecto
        });
        
        loader.load('Fardo.glb', function (gltf) {
          fardoModelo = gltf.scene;
        });

        // Configurar botones de selección
        document.getElementById('btn-maquina').addEventListener('click', () => { 
          modeloSeleccionado = maquinaModelo; 
          status.innerText = "Máquina seleccionada. Toca la pantalla para ponerla.";
        });
        document.getElementById('btn-fardo').addEventListener('click', () => { 
          modeloSeleccionado = fardoModelo; 
          status.innerText = "Fardo seleccionado. Toca la pantalla para ponerlo.";
        });

        // Evento al tocar la pantalla en AR (Instanciar el objeto)
        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        // Crear el "Retículo" (el círculo que flota en el piso para apuntar)
        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0xf2b705 })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);
      }

      // Función que coloca el modelo en el mundo real
      function onSelect() {
        if (reticle.visible && modeloSeleccionado) {
          const clone = modeloSeleccionado.clone();
          clone.position.setFromMatrixPosition(reticle.matrix);
          scene.add(clone);
          status.innerText = "¡Objeto colocado!";
        }
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      // Motor físico y detección del suelo (Hit-Test)
      function render(timestamp, frame) {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (hitTestSourceRequested === false) {
            session.requestReferenceSpace('viewer').then(function (referenceSpace) {
              session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                hitTestSource = source;
              });
            });
            session.addEventListener('end', function () {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });
            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
              const hit = hitTestResults[0];
              reticle.visible = true;
              reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
        }
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
