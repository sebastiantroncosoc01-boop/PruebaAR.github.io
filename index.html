<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Visor AR - Industrial</title>

  <!-- Importar model-viewer de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    body { 
      margin: 0; 
      font-family: sans-serif; 
      background: #f1efe9; 
      overflow: hidden; 
      height: 100vh; 
      width: 100vw; 
    }
    
    model-viewer { 
      width: 100%; 
      height: 100%; 
    }
    
    /* Menú inferior para cambiar de escala */
    .menu-escala { 
      position: absolute; 
      bottom: 40px; 
      left: 0; 
      right: 0; 
      display: flex; 
      justify-content: center; 
      gap: 15px; 
      z-index: 10; 
    }
    
    .btn { 
      padding: 15px 25px; 
      background: #1f2328; 
      color: white; 
      border: 2px solid #f2b705; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 16px;
      cursor: pointer; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    .btn:active {
      background: #f2b705;
      color: #1f2328;
    }

    /* Botón de AR personalizado */
    .ar-button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      background: #f2b705;
      color: #1f2328;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Visor unificado: ar-modes asegura compatibilidad con Android (scene-viewer) y iOS (quick-look) -->
  <model-viewer 
    id="mv-visor" 
    src="conjunto.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">
      Abrir en AR
    </button>
  </model-viewer>

  <!-- Botones que cambian el archivo 3D a visualizar -->
  <div class="menu-escala">
    <button class="btn" onclick="document.getElementById('mv-visor').src='conjunto.glb'">Escala 1:1</button>
    <button class="btn" onclick="document.getElementById('mv-visor').src='conjunto_1a60.glb'">Escala 1:60</button>
  </div>

</body>
</html>
