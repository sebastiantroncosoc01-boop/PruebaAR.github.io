<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Visor AR Híbrido - Industrial</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    body { margin: 0; font-family: sans-serif; background: #f1efe9; overflow: hidden; }
    
    #ios-container, #android-container { display: none; width: 100vw; height: 100vh; }
    
    /* iOS */
    model-viewer { width: 100%; height: 100%; }
    .ios-menu { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 10; }
    .btn { padding: 12px 20px; background: #1f2328; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    /* Android */
    /* pointer-events: none; evita que la capa invisible bloquee los toques a la cámara AR */
    #android-menu { position: absolute; bottom: 80px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 10; pointer-events: none; }
    .btn-android { pointer-events: auto; padding: 12px 20px; background: #f2b705; color: #1f2328; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #android-status { position: absolute; top: 20px; left: 20px; right: 20px; text-align: center; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; z-index: 10; pointer-events: none; }
    
    /* Panel de Control AR Android */
    #android-controls {
      display: none;
      position: absolute;
      top: 70px; left: 20px; right: 20px;
      background: rgba(31, 35, 40, 0.9);
      padding: 15px; border-radius: 12px;
      color: white; z-index: 10;
      pointer-events: auto; 
    }
    #android-controls label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 8px; }
    
    .escala-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-escala { flex: 1; padding: 10px; background: #3b4252; color: white; border: 1px solid #5f6368; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-escala.active { background: #f2b705; color: #1f2328; }
    
    #android-controls input { width: 100%; margin-bottom: 15px; }
    #btn-borrar { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- iOS -->
  <div id="ios-container">
    <model-viewer id="mv-ios" src="conjunto.glb" ar ar-modes="quick-look" ar-scale="fixed" camera-controls shadow-intensity="1">
      <button slot="ar-button" class="btn" style="position:absolute; top:20px; right:20px;">Abrir en AR (iOS)</button>
    </model-viewer>
    <div class="ios-menu">
      <button class="btn" onclick="document.getElementById('mv-ios').src='conjunto.glb'">Escala 1:1</button>
      <button class="btn" onclick="document.getElementById('mv-ios').src='conjunto_1a60.glb'">Escala 1:60</button>
    </div>
  </div>

  <!-- ANDROID -->
  <div id="android-container">
    <div id="android-status">Iniciando motor AR...</div>
    
    <div id="android-controls">
      <label>Escala del objeto:</label>
      <div class="escala-container">
        <button id="btn-esc-1a1" class="btn-escala active">1:1</button>
        <button id="btn-esc-1a60" class="btn-escala">1:60</button>
      </div>
      
      <label>Rotar objeto</label>
      <input type="range" id="slider-rotacion" min="0" max="360" step="1" value="0">
      
      <button id="btn-borrar">Borrar último</button>
    </div>

    <div id="android-menu">
      <button class="btn-android" id="btn-maquina">Poner Máquina</button>
      <button class="btn-android" id="btn-fardo">Poner Fardo</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isIOS) {
      document.getElementById('ios-container').style.display = 'block';
    } else {
      document.getElementById('android-container').style.display = 'block';
      initAndroidAR();
    }

    function initAndroidAR() {
      let container, camera, scene, renderer, reticle;
      let hitTestSource = null, hitTestSourceRequested = false;
      let loader = new GLTFLoader();
      
      let maquinaModelo, fardoModelo;
      let modeloSeleccionado = null; 
      
      let objetosColocados = [];
      let ultimoObjeto = null;

      const status = document.getElementById('android-status');
      const controlsPanel = document.getElementById('android-controls');
      const sliderRotacion = document.getElementById('slider-rotacion');
      const btnEsc1a1 = document.getElementById('btn-esc-1a1');
      const btnEsc1a60 = document.getElementById('btn-esc-1a60');

      init();
      animate();

      function init() {
        container = document.getElementById('android-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; 
        container.appendChild(renderer.domElement);

        const arButton = ARButton.createButton(renderer, { 
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        });
        arButton.style.bottom = '150px'; 
        document.body.appendChild(arButton);

        // --- SOLUCIÓN: BLOQUEAR TOQUES FALSOS ---
        // Evita que tocar un botón ponga un objeto en la pantalla AR
        document.body.addEventListener('beforexrselect', (ev) => {
          if (ev.target.closest('#android-controls') || ev.target.closest('#android-menu')) {
            ev.preventDefault();
          }
        });

        loader.load('Maquina A prueba.glb', (gltf) => {
          maquinaModelo = gltf.scene;
          status.innerText = "Máquina cargada. Selecciona y apunta al suelo.";
          modeloSeleccionado = maquinaModelo;
        });
        
        loader.load('Fardo.glb', (gltf) => {
          fardoModelo = gltf.scene;
        });

        document.getElementById('btn-maquina').addEventListener('click', () => { 
          modeloSeleccionado = maquinaModelo; 
          status.innerText = "Máquina seleccionada. Toca el suelo para ponerla.";
        });
        document.getElementById('btn-fardo').addEventListener('click', () => { 
          modeloSeleccionado = fardoModelo; 
          status.innerText = "Fardo seleccionado. Toca el suelo para ponerlo.";
        });

        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0xf2b705 })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // --- CONTROLES DEL PANEL ---

        btnEsc1a1.addEventListener('click', () => {
          if(ultimoObjeto) {
            ultimoObjeto.scale.set(1, 1, 1);
            btnEsc1a1.classList.add('active');
            btnEsc1a60.classList.remove('active');
          }
        });

        btnEsc1a60.addEventListener('click', () => {
          if(ultimoObjeto) {
            ultimoObjeto.scale.set(1/60, 1/60, 1/60);
            btnEsc1a60.classList.add('active');
            btnEsc1a1.classList.remove('active');
          }
        });

        sliderRotacion.addEventListener('input', (e) => {
          if(ultimoObjeto) ultimoObjeto.rotation.y = e.target.value * (Math.PI / 180);
        });

        document.getElementById('btn-borrar').addEventListener('click', () => {
          if(ultimoObjeto) {
            scene.remove(ultimoObjeto);
            objetosColocados.pop(); // Saca el último de la lista
            
            // Asigna el nuevo "último objeto" si queda alguno
            ultimoObjeto = objetosColocados.length > 0 ? objetosColocados[objetosColocados.length - 1] : null;
            
            if(!ultimoObjeto) {
              controlsPanel.style.display = 'none';
              status.innerText = "Selecciona un objeto y colócalo.";
            } else {
              // Si queda un objeto, actualizar el slider de rotación visualmente
              sliderRotacion.value = ultimoObjeto.rotation.y * (180 / Math.PI);
            }
          }
        });
      }

      function onSelect() {
        if (reticle.visible && modeloSeleccionado) {
          const clone = modeloSeleccionado.clone();
          clone.position.setFromMatrixPosition(reticle.matrix);
          
          // Entra por defecto en 1:1
          clone.scale.set(1, 1, 1);
          btnEsc1a1.classList.add('active');
          btnEsc1a60.classList.remove('active');
          sliderRotacion.value = 0;
          
          scene.add(clone);
          objetosColocados.push(clone);
          ultimoObjeto = clone;
          
          controlsPanel.style.display = 'block';
          status.innerText = "Objeto colocado.";
        }
      }

      function animate() { renderer.setAnimationLoop(render); }

      function render(timestamp, frame) {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (hitTestSourceRequested === false) {
            session.requestReferenceSpace('viewer').then((referenceSpace) => {
              session.requestHitTestSource({ space: referenceSpace }).then((source) => { hitTestSource = source; });
            });
            session.addEventListener('end', () => { 
              hitTestSourceRequested = false; 
              hitTestSource = null; 
              controlsPanel.style.display = 'none'; 
            });
            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
              reticle.visible = true;
              reticle.matrix.fromArray(hitTestResults[0].getPose(referenceSpace).transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
        }
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
